<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="haze" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F1EFE9" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#haze)"/>
  <circle cx="128" cy="128" r="88" fill="none" stroke="#DCD8CD" stroke-width="1"/>
  <!-- generation ring -->
  <circle cx="128" cy="128" r="78" fill="none" stroke="#B9B4A6" stroke-width="1.2" stroke-dasharray="3 4"/>
  <!-- generation arrowheads -->
  <g fill="#8A857A">
    <path d="M78 58 l6 -2 -1 7 Z"/>
    <path d="M178 58 l1 7 -6 -2 Z"/>
    <path d="M206 149 l-6 3 2 -7 Z"/>
    <path d="M132 210 l-6 -3 6 -2 Z"/>
    <path d="M50 149 l-2 -7 6 3 Z"/>
  </g>
  <!-- generation labels -->
  <g font-family="sans-serif" font-size="11" fill="#6E6A60" text-anchor="middle">
    <text x="76" y="44">木生火</text>
    <text x="180" y="44">火生土</text>
    <text x="212" y="150">土生金</text>
    <text x="128" y="228">金生水</text>
    <text x="44" y="150">水生木</text>
  </g>
  <!-- center overcoming pentagram chords -->
  <g stroke="#6A6A66" stroke-width="1.4" opacity="0.55">
    <line x1="53.8" y1="103.9" x2="202.2" y2="103.9"/>
    <line x1="202.2" y1="103.9" x2="82.1" y2="191.1"/>
    <line x1="82.1" y1="191.1" x2="128" y2="50"/>
    <line x1="128" y1="50" x2="173.9" y2="191.1"/>
    <line x1="173.9" y1="191.1" x2="53.8" y2="103.9"/>
  </g>
  <!-- intersection dots -->
  <g fill="#3C3B38">
    <circle cx="128" cy="104" r="3"/>
    <circle cx="144" cy="150" r="3"/>
    <circle cx="112" cy="150" r="3"/>
    <circle cx="154" cy="126" r="3"/>
    <circle cx="102" cy="126" r="3"/>
  </g>
  <!-- overcoming labels -->
  <g font-family="sans-serif" font-size="10" fill="#7A766C" text-anchor="middle">
    <text x="128" y="100">木克土</text>
    <text x="150" y="158">土克水</text>
    <text x="106" y="158">水克火</text>
    <text x="160" y="136">金克木</text>
    <text x="96" y="136">火克金</text>
  </g>
  <!-- element circles -->
  <g stroke="#FFFFFF" stroke-width="2">
    <circle cx="128" cy="50" r="28" fill="#E5484D"/>
    <circle cx="202.2" cy="103.9" r="28" fill="#C96A3B"/>
    <circle cx="173.9" cy="191.1" r="28" fill="#E8C94A"/>
    <circle cx="82.1" cy="191.1" r="28" fill="#3D8BD8"/>
    <circle cx="53.8" cy="103.9" r="28" fill="#4C8A3F"/>
  </g>
  <g font-family="sans-serif" font-size="26" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">
    <text x="128" y="51">火</text>
    <text x="202.2" y="105">土</text>
    <text x="173.9" y="192">金</text>
    <text x="82.1" y="192">水</text>
    <text x="53.8" y="105">木</text>
  </g>
</svg>
